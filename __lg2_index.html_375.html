<!DOCTYPE html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="index.html" onload="run()" style="position:absolute;left:0;top:0;width:375px;height:1200px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
var W = 375;
function run(){ try{ var d = document.getElementById('f').contentDocument, Wd = d.defaultView;
  var h = d.querySelector('.logo-img'), hd = d.querySelector('.site-header'),
      hr = h.getBoundingClientRect(), hdr = hd.getBoundingClientRect();
  document.getElementById('out').textContent = 'LG w='+Math.round(hr.width)+' h='+Math.round(hr.height)+' hdrH='+Math.round(hdr.height)+' sw='+d.documentElement.scrollWidth+' ovf='+(d.documentElement.scrollWidth>W);
  }catch(e){ document.getElementById('out').textContent = 'ERR '+e.message; } }
</script></body>
